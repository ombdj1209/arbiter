[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "0.1.0"
description = "Payment decision lab: off-policy evaluation graded against ground truth"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["arbiter"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
