[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arbiter"
version = "0.1.0"
description = "Payment decision lab: off-policy evaluation graded against ground truth"
requires-python = ">=3.10"
dependencies = ["numpy>=2.2.6", "scipy>=1.15.3", "scikit-learn>=1.7.2"]

[project.optional-dependencies]
dev = ["pytest>=9.1.1"]

[tool.setuptools]
packages = ["arbiter"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
